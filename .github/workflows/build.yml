name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Verify and build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install hash-locked dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            --require-hashes --only-binary :all: -r requirements-lock.txt

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = .venv\Scripts\python.exe -c "from orbot import __version__; print(__version__)"
          if ("v$version" -ne $env:TAG) { throw "Tag $env:TAG does not match app version $version." }

      - name: Run tests, lint, types and security checks
        run: ./scripts/verify.ps1

      - name: Capture UI screenshots
        continue-on-error: true
        run: .venv\Scripts\python.exe scripts/gui_smoke.py --screenshot

      - name: Upload UI screenshots
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: docs/images/*.png
          retention-days: 14

      - name: Build folder ZIP and single-file EXE
        run: ./scripts/build.ps1

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbot-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attest and draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbot-windows-x64
          path: dist

      - name: Check checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          cat > notes.md <<EOF
          **Khuyên dùng:** tải \`Orbot-${version}-windows-x64.zip\`, giải nén rồi mở \`Orbot.exe\`.
          Bản một file: \`Orbot-${version}.exe\`.

          Windows SmartScreen có thể báo "Windows đã bảo vệ máy tính của bạn" vì file chưa ký số
          và còn ít lượt tải. Kiểm tra file trước khi chọn **Thông tin thêm → Vẫn chạy**:

          - Mã SHA-256 nằm trong \`SHA256SUMS.txt\`.
          - Chứng nhận build từ GitHub Actions: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`

          Thay đổi: docs/CHANGELOG.md.
          EOF
          gh release create "$TAG" dist/*.exe dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Orbot ${version}" --notes-file notes.md
