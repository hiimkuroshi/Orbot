name: Build Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Phát hành phiên bản trong orbot/__init__.py (chỉ trên main)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a release run; newer pushes replace older test runs.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    name: Verify and build
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install hash-locked dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check `
            --require-hashes --only-binary :all: -r requirements-lock.txt

      - name: Read the app version and check the release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          $version = .venv\Scripts\python.exe -c "from orbot import __version__; print(__version__)"
          if ($env:REF_TYPE -eq 'tag' -and "v$version" -ne $env:REF_NAME) {
            throw "Tag $env:REF_NAME does not match app version $version."
          }
          if ($env:RELEASE -eq 'true') {
            if ($env:REF_NAME -ne 'main') { throw 'Releases can only be started from main.' }
            git ls-remote --exit-code --tags origin "refs/tags/v$version" | Out-Null
            $exists = $LASTEXITCODE -eq 0
            $global:LASTEXITCODE = 0
            if ($exists) { throw "Tag v$version already exists. Raise the version in orbot/__init__.py first." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Run tests, lint, types and security checks
        run: ./scripts/verify.ps1

      - name: Capture UI screenshots
        continue-on-error: true
        run: .venv\Scripts\python.exe scripts/gui_smoke.py --screenshot

      - name: Upload UI screenshots
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: docs/images/*.png
          retention-days: 14

      - name: Build folder ZIP and single-file EXE
        run: ./scripts/build.ps1

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orbot-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    name: Attest and publish release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: orbot-windows-x64
          path: dist

      - name: Check checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.exe
            dist/*.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="$VERSION"
          tag="v${version}"
          cat > notes.md <<EOF
          **Khuyên dùng:** tải \`Orbot-${version}-windows-x64.zip\`, giải nén rồi mở \`Orbot.exe\`.
          Bản một file: \`Orbot-${version}.exe\`.

          Windows SmartScreen có thể báo "Windows đã bảo vệ máy tính của bạn" vì file chưa ký số
          và còn ít lượt tải. Kiểm tra file trước khi chọn **Thông tin thêm → Vẫn chạy**:

          - Mã SHA-256 nằm trong \`SHA256SUMS.txt\`.
          - Chứng nhận build từ GitHub Actions: \`gh attestation verify <file> -R ${GITHUB_REPOSITORY}\`

          Thay đổi: docs/CHANGELOG.md.
          EOF
          # A pushed tag must already exist; a release started from main creates the tag on this commit.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then source=(--verify-tag); else source=(--target "$GITHUB_SHA"); fi
          gh release create "$tag" dist/*.exe dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" "${source[@]}" --latest \
            --title "Orbot ${version}" --notes-file notes.md
