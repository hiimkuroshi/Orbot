[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = "build/cache/ruff"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
files = ["orbot"]
cache_dir = "build/cache/mypy"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "websocket.*"
ignore_missing_imports = true
